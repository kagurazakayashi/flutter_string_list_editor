name: flutter_string_list_editor
description: >-
  A reusable Flutter package providing a visual string list editor dialog with
  configurable delimiters, plus built-in English / Chinese localizations.
version: 1.0.0

environment:
  sdk: ^3.0.0
  flutter: '>=3.32.0'

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

# 純 Dart + Flutter UI 實作，無平台原生程式碼（因此是 Package 而非 Plugin）。
